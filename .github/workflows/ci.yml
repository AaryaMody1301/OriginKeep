name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Validate browser companions
        run: |
          node --check extension/service-worker.js
          node --check extension/context-capture.js
          node -e "const m=JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8')); if(m.manifest_version!==3 || !m.permissions.includes('downloads') || !m.permissions.includes('nativeMessaging') || !m.permissions.includes('storage') || !m.optional_host_permissions?.includes('https://*/*') || !m.key || !m.icons?.['128']) process.exit(1)"
          node -e "const m=JSON.parse(require('fs').readFileSync('extension/manifest.firefox.json','utf8')); if(m.manifest_version!==3 || !m.permissions.includes('downloads') || !m.permissions.includes('nativeMessaging') || !m.background?.scripts?.includes('service-worker.js') || m.browser_specific_settings?.gecko?.id!=='originkeep@aaryamody1301.github.io') process.exit(1)"
      - name: Validate Tauri bundle config
        run: node -e "const c=JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')); if(!c.bundle?.active || c.bundle?.targets!=='all' || !c.bundle?.externalBin?.includes('binaries/originkeep-native-host') || !c.bundle?.windows?.nsis?.installerHooks || !c.bundle?.icon?.includes('icons/icon.icns')) process.exit(1)"

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Use Rust stable
        run: rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - run: npm run icons
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Prepare native-host sidecar
        run: npm run prepare:sidecar
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked

  windows-bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - name: Build NSIS installer with bundled native host
        run: npm run bundle:windows
      - name: Package Chromium and Firefox smoke assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\chromium, artifacts\firefox | Out-Null
          Copy-Item extension\service-worker.js, extension\context-capture.js, extension\icon.png artifacts\chromium\
          Copy-Item extension\manifest.json artifacts\chromium\manifest.json
          Copy-Item extension\service-worker.js, extension\context-capture.js, extension\icon.png artifacts\firefox\
          Copy-Item extension\manifest.firefox.json artifacts\firefox\manifest.json
          Compress-Archive -Path artifacts\chromium\* -DestinationPath artifacts\OriginKeep-Companion-Chromium.zip -Force
          Compress-Archive -Path artifacts\firefox\* -DestinationPath artifacts\OriginKeep-Companion-Firefox.zip -Force
          Copy-Item src-tauri\target\release\bundle\nsis\*.exe artifacts\
          if (-not (Test-Path src-tauri\binaries\originkeep-native-host-x86_64-pc-windows-msvc.exe)) { throw 'Prepared native host sidecar is missing' }
          Remove-Item -Recurse -Force artifacts\chromium, artifacts\firefox
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-origin-2-smoke
          path: artifacts/*
          if-no-files-found: error

  macos-bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - name: Build unsigned macOS DMG with bundled native host
        run: npm run bundle:macos
      - name: Verify DMG and prepared sidecar
        run: |
          test -n "$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "$(find src-tauri/binaries -name 'originkeep-native-host-*apple-darwin' -print -quit)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-origin-2-smoke
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  linux-bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf fakeroot
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - name: Build AppImage and DEB with bundled native host
        run: npm run bundle:linux
      - name: Verify Linux bundles and prepared sidecar
        run: |
          test -n "$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)"
          test -n "$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"
          test -n "$(find src-tauri/binaries -name 'originkeep-native-host-*linux-*' -print -quit)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-origin-2-smoke
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
