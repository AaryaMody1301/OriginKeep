name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Validate Chromium companion
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('extension/manifest.json', 'utf8'));
          const required = ['downloads', 'nativeMessaging', 'storage'];
          if (m.manifest_version !== 3 || !required.every((p) => m.permissions.includes(p)) || !m.key || !m.icons?.['128']) process.exit(1);
          if (!m.content_scripts?.some((script) => script.js?.includes('context-capture.js'))) process.exit(1);
          NODE
      - name: Validate Firefox companion
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('extension/manifest.firefox.json', 'utf8'));
          const required = ['downloads', 'nativeMessaging', 'storage'];
          const gecko = m.browser_specific_settings?.gecko;
          if (m.manifest_version !== 3 || !required.every((p) => m.permissions.includes(p))) process.exit(1);
          if (gecko?.id !== 'originkeep@aaryamody.local') process.exit(1);
          const categories = gecko?.data_collection_permissions?.required ?? [];
          if (!categories.includes('websiteActivity') || !categories.includes('websiteContent')) process.exit(1);
          NODE
      - name: Stage browser-specific packages
        run: |
          npm run stage:companions
          node -e "JSON.parse(require('fs').readFileSync('artifacts/browser-companions/chromium/manifest.json','utf8')); JSON.parse(require('fs').readFileSync('artifacts/browser-companions/firefox/manifest.json','utf8'))"
      - name: Validate Tauri bundle configs
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const mac = JSON.parse(fs.readFileSync('src-tauri/tauri.macos.conf.json', 'utf8'));
          const linux = JSON.parse(fs.readFileSync('src-tauri/tauri.linux.conf.json', 'utf8'));
          if (!c.bundle?.active || !c.bundle?.targets?.includes('nsis') || !c.bundle?.externalBin?.includes('binaries/originkeep-native-host') || !c.bundle?.windows?.nsis?.installerHooks) process.exit(1);
          if (!mac.bundle?.targets?.includes('dmg') || !mac.bundle?.externalBin?.includes('binaries/originkeep-native-host')) process.exit(1);
          if (!linux.bundle?.targets?.includes('deb') || !linux.bundle?.targets?.includes('appimage') || !linux.bundle?.externalBin?.includes('binaries/originkeep-native-host')) process.exit(1);
          NODE

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Use Rust stable
        run: rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - run: npm run icons
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Prepare native-host sidecar
        run: npm run prepare:sidecar
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - name: Compile Linux desktop without bundling
        run: npx tauri build --no-bundle --config src-tauri/tauri.linux.conf.json

  windows-bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - name: Build NSIS installer with bundled native host
        run: npm run bundle:windows
      - name: Package Windows and browser smoke assets
        shell: pwsh
        run: |
          npm run stage:companions
          New-Item -ItemType Directory -Force -Path artifacts\release | Out-Null
          Compress-Archive -Path artifacts\browser-companions\chromium\* -DestinationPath artifacts\release\OriginKeep-Chromium.zip -Force
          Compress-Archive -Path artifacts\browser-companions\firefox\* -DestinationPath artifacts\release\OriginKeep-Firefox.zip -Force
          Copy-Item src-tauri\target\release\bundle\nsis\*.exe artifacts\release\
          if (-not (Test-Path src-tauri\binaries\originkeep-native-host-x86_64-pc-windows-msvc.exe)) { throw 'Prepared native host sidecar is missing' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-originkeep2-smoke
          path: artifacts/release/*
          if-no-files-found: error

  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - run: npm run icons
      - run: npm run prepare:sidecar
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - name: Compile macOS desktop without signing/bundling
        run: npx tauri build --no-bundle --config src-tauri/tauri.macos.conf.json
