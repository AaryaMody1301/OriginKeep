name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Validate extension manifest
        run: node -e "const m=JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8')); if(m.manifest_version!==3 || !m.permissions.includes('downloads') || !m.permissions.includes('nativeMessaging') || !m.key || !m.icons?.['128']) process.exit(1)"
      - name: Validate Tauri bundle config
        run: node -e "const c=JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')); if(!c.bundle?.active || !c.bundle?.targets?.includes('nsis') || !c.bundle?.externalBin?.includes('binaries/originkeep-native-host') || !c.bundle?.windows?.nsis?.installerHooks) process.exit(1)"

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Use Rust stable
        run: rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - run: npm run icons
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Prepare native-host sidecar
        run: npm run prepare:sidecar
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked

  windows-bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - name: Build NSIS installer with bundled native host
        run: npm run bundle:windows
      - name: Package release-candidate smoke assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path extension\* -DestinationPath artifacts\OriginKeep-Companion.zip -Force
          Copy-Item src-tauri\target\release\bundle\nsis\*.exe artifacts\
          if (-not (Test-Path src-tauri\binaries\originkeep-native-host-x86_64-pc-windows-msvc.exe)) { throw 'Prepared native host sidecar is missing' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-release-candidate-smoke
          path: artifacts/*
          if-no-files-found: error
