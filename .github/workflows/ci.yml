name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Validate browser companions
        run: |
          node --check extension/service-worker.js
          node --check extension/context-capture.js
          node --check extension/popup.js
          npm run prepare:browsers
          node - <<'NODE'
          const fs = require('fs');
          const chrome = JSON.parse(fs.readFileSync('browser-packages/chromium/manifest.json','utf8'));
          const firefox = JSON.parse(fs.readFileSync('browser-packages/firefox/manifest.json','utf8'));
          if (chrome.manifest_version !== 3 || !chrome.background?.service_worker || !chrome.permissions.includes('downloads') || !chrome.permissions.includes('nativeMessaging') || !chrome.optional_host_permissions?.length) process.exit(1);
          if (firefox.manifest_version !== 3 || !firefox.background?.scripts?.length || firefox.browser_specific_settings?.gecko?.id !== 'originkeep@originkeep.app' || !firefox.permissions.includes('downloads') || !firefox.permissions.includes('nativeMessaging')) process.exit(1);
          NODE
      - name: Validate cross-platform Tauri bundle config
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const base = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
          const win = JSON.parse(fs.readFileSync('src-tauri/tauri.windows.conf.json','utf8'));
          const linux = JSON.parse(fs.readFileSync('src-tauri/tauri.linux.conf.json','utf8'));
          const mac = JSON.parse(fs.readFileSync('src-tauri/tauri.macos.conf.json','utf8'));
          if (!base.bundle?.active || !base.bundle?.externalBin?.includes('binaries/originkeep-native-host')) process.exit(1);
          if (!win.bundle?.targets?.includes('nsis') || !win.bundle?.windows?.nsis?.installerHooks) process.exit(1);
          if (!linux.bundle?.targets?.includes('appimage') || !linux.bundle?.targets?.includes('deb')) process.exit(1);
          if (!mac.bundle?.targets?.includes('app') || !mac.bundle?.targets?.includes('dmg')) process.exit(1);
          NODE
      - name: Validate Windows Firefox registration
        run: grep -q "Mozilla\\\\NativeMessagingHosts" src-tauri/windows/hooks.nsh

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Use Rust stable
        run: rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - run: npm run icons
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Prepare native-host sidecar
        run: npm run prepare:sidecar
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --locked

  windows-bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - name: Build NSIS installer with bundled native host
        run: npm run bundle:windows
      - name: Package Windows and browser smoke assets
        shell: pwsh
        run: |
          npm run prepare:browsers
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path browser-packages\chromium\* -DestinationPath artifacts\OriginKeep-Companion-Chromium.zip -Force
          Compress-Archive -Path browser-packages\firefox\* -DestinationPath artifacts\OriginKeep-Companion-Firefox.zip -Force
          Copy-Item src-tauri\target\release\bundle\nsis\*.exe artifacts\
          if (-not (Test-Path src-tauri\binaries\originkeep-native-host-x86_64-pc-windows-msvc.exe)) { throw 'Prepared native host sidecar is missing' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-and-browser-smoke
          path: artifacts/*
          if-no-files-found: error

  linux-bundle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - name: Build Linux AppImage and Debian package
        run: npm run bundle:linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-bundle-smoke
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  macos-bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - name: Build macOS app and DMG with ad-hoc signature
        run: npm run bundle:macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-bundle-smoke
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
