name: Publish Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Validate release tag and main ancestry
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if (-not $env:GITHUB_REF_NAME.StartsWith("v$version")) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release tags must point to a commit already contained in main" }

      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Generate Tauri icons
        run: npm run icons

      - name: Build Windows installer and create draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OriginKeep ${{ github.ref_name }}"
          releaseBody: |
            OriginKeep desktop release candidate for Windows, macOS and Linux, plus separate Chromium and Firefox companions.

            The desktop builds use the same local-first provenance, File Passport, freshness, trust-evidence and safe-lifecycle implementation. Safari automatic download capture is not claimed because Apple's current Safari Web Extension tooling does not support the downloads manifest capability used by OriginKeep.

            This release remains a draft until the clean-machine checklists in docs/RELEASE.md are completed. Unsigned platform builds can trigger operating-system reputation warnings; GitHub artifact attestations establish build provenance but do not replace platform code signing or a security review.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --bundles nsis

      - name: Package browser companions
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path companion-chromium, companion-firefox | Out-Null
          Copy-Item extension\service-worker.js, extension\context-capture.js, extension\icon.png companion-chromium\
          Copy-Item extension\manifest.json companion-chromium\manifest.json
          Copy-Item extension\service-worker.js, extension\context-capture.js, extension\icon.png companion-firefox\
          Copy-Item extension\manifest.firefox.json companion-firefox\manifest.json
          $chromium = "OriginKeep-Companion-Chromium-$env:GITHUB_REF_NAME.zip"
          $firefox = "OriginKeep-Companion-Firefox-$env:GITHUB_REF_NAME.zip"
          Compress-Archive -Path companion-chromium\* -DestinationPath $chromium -Force
          Compress-Archive -Path companion-firefox\* -DestinationPath $firefox -Force
          "CHROMIUM_ASSET=$chromium" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FIREFOX_ASSET=$firefox" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload browser companions to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload $env:GITHUB_REF_NAME $env:CHROMIUM_ASSET $env:FIREFOX_ASSET --clobber

      - name: Attest NSIS installer provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: "src-tauri/target/release/bundle/nsis/*.exe"

      - name: Attest browser companion provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: "OriginKeep-Companion-*.zip"

  publish-macos:
    needs: publish-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - name: Build unsigned macOS DMG
        run: npm run bundle:macos
      - name: Upload macOS DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in src-tauri/target/release/bundle/dmg/*.dmg; do
            gh release upload "$GITHUB_REF_NAME" "$file" --clobber
          done
      - name: Attest macOS DMG provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: "src-tauri/target/release/bundle/dmg/*.dmg"

  publish-linux:
    needs: publish-windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf fakeroot
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - name: Build AppImage and DEB
        run: npm run bundle:linux
      - name: Upload Linux bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb; do
            gh release upload "$GITHUB_REF_NAME" "$file" --clobber
          done
      - name: Attest Linux bundle provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
