name: Publish Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install --ignore-scripts

      - name: Generate Tauri icons
        run: npm run icons

      - name: Build Windows installer and create draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "OriginKeep v__VERSION__"
          releaseBody: |
            Windows x64 NSIS build produced by the OriginKeep release workflow.

            This release remains a draft until the installer has been reviewed and, for public distribution, Windows code signing has been configured with project-owned signing credentials.
          releaseDraft: true
          prerelease: false
          args: --bundles nsis

      - name: Attest NSIS installer provenance
        uses: actions/attest@v4
        with:
          subject-path: "src-tauri/target/release/bundle/nsis/*.exe"
