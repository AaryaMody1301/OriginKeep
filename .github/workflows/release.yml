name: Publish OriginKeep

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Validate release tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if (-not $env:GITHUB_REF_NAME.StartsWith("v$version")) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version"
          }

      - name: Install Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Generate Tauri icons
        run: npm run icons

      - name: Build Windows installer and create draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OriginKeep ${{ github.ref_name }}"
          releaseBody: |
            OriginKeep File Passport release produced from one tagged source for Windows, macOS, Linux, Chromium-family browsers and Firefox.

            Chrome, Edge and Firefox support automatic download provenance capture. Safari/macOS users use local adoption plus macOS provenance import because Safari does not expose the WebExtensions downloads API.

            This release remains a draft until the platform acceptance checks in docs/RELEASE.md are completed. Unsigned desktop packages can trigger platform reputation/signing warnings. GitHub artifact attestations establish build provenance but do not replace platform code signing or security review.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --bundles nsis

      - name: Package browser companions
        shell: pwsh
        run: |
          npm run stage:companions
          $chromium = "OriginKeep-Chromium-$env:GITHUB_REF_NAME.zip"
          $firefox = "OriginKeep-Firefox-$env:GITHUB_REF_NAME.zip"
          Compress-Archive -Path artifacts\browser-companions\chromium\* -DestinationPath $chromium -Force
          Compress-Archive -Path artifacts\browser-companions\firefox\* -DestinationPath $firefox -Force
          "CHROMIUM_ASSET=$chromium" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FIREFOX_ASSET=$firefox" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload browser companions to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload $env:GITHUB_REF_NAME $env:CHROMIUM_ASSET $env:FIREFOX_ASSET --clobber

      - name: Attest NSIS installer provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: "src-tauri/target/release/bundle/nsis/*.exe"

      - name: Attest Chromium companion provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: "${{ env.CHROMIUM_ASSET }}"

      - name: Attest Firefox companion provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: "${{ env.FIREFOX_ASSET }}"

  publish-macos:
    needs: publish-windows
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - run: npm ci --ignore-scripts
      - run: npm run bundle:macos
      - name: Upload macOS DMG to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" src-tauri/target/release/bundle/dmg/*.dmg --clobber
      - name: Attest macOS DMG provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: "src-tauri/target/release/bundle/dmg/*.dmg"

  publish-linux:
    needs: publish-windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri
      - run: npm ci --ignore-scripts
      - run: npm run bundle:linux
      - name: Upload Linux packages to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" src-tauri/target/release/bundle/deb/*.deb --clobber
          gh release upload "$GITHUB_REF_NAME" src-tauri/target/release/bundle/appimage/*.AppImage --clobber
      - name: Attest Linux package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
