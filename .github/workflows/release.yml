name: Publish OriginKeep

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: "nsis"
            attest_path: "src-tauri/target/release/bundle/nsis/*.exe"
          - platform: ubuntu-22.04
            bundles: "appimage,deb"
            attest_path: "src-tauri/target/release/bundle/appimage/*.AppImage"
          - platform: macos-latest
            bundles: "app,dmg"
            attest_path: "src-tauri/target/release/bundle/dmg/*.dmg"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Validate release tag
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const version = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')).version;
          const tag = process.env.GITHUB_REF_NAME;
          if (!tag.startsWith(`v${version}`)) {
            throw new Error(`Tag ${tag} does not match desktop version ${version}`);
          }
          NODE

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      - run: npm ci --ignore-scripts
      - run: npm run icons

      - name: Build desktop bundle and create/update draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OriginKeep ${{ github.ref_name }}"
          releaseBody: |
            OriginKeep Universal File Passport release candidate.

            Desktop bundles and Chromium/Firefox companions are built from the same tagged source. The release remains a draft until the platform checks in docs/RELEASE.md have been completed. GitHub artifact attestations establish build provenance; they do not replace Windows Authenticode, Apple signing/notarization, browser-store review or a security audit.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --bundles ${{ matrix.bundles }}

      - name: Attest primary desktop artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ matrix.attest_path }}

  publish-browsers:
    needs: publish-desktop
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prepare:browsers
      - name: Package Chromium and Firefox companions
        run: |
          (cd browser-packages/chromium && zip -qr "../../OriginKeep-Companion-Chromium-${GITHUB_REF_NAME}.zip" .)
          (cd browser-packages/firefox && zip -qr "../../OriginKeep-Companion-Firefox-${GITHUB_REF_NAME}.zip" .)
      - name: Upload browser packages to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" OriginKeep-Companion-*.zip --clobber
      - name: Attest browser package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: "OriginKeep-Companion-*.zip"
