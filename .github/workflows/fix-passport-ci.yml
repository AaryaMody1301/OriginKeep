name: Apply Passport CI fix

on:
  push:
    branches:
      - origin-2-universal-file-passport

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: origin-2-universal-file-passport
          fetch-depth: 0

      - name: Apply exact Rust fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/passport.rs")
          lines = path.read_text().splitlines()

          def indent_of(line):
              return line[: len(line) - len(line.lstrip())]

          def find_start(predicate):
              matches = []
              for index, line in enumerate(lines[:-1]):
                  if line.strip() == "statement" and predicate(lines[index + 1].strip()):
                      matches.append(index)
              if len(matches) != 1:
                  raise SystemExit(f"Expected one matching statement block, found {len(matches)}")
              return matches[0]

          def finish_collected_block(start):
              collect_index = None
              for index in range(start + 1, min(start + 40, len(lines))):
                  if lines[index].strip() == ".collect::<rusqlite::Result<Vec<_>>>()":
                      collect_index = index
                      break
              if collect_index is None or collect_index + 1 >= len(lines):
                  raise SystemExit("Could not locate collected rusqlite block end")
              end = collect_index + 1
              if lines[end].strip() != ".map_err(|error| error.to_string())?":
                  raise SystemExit("Unexpected collected rusqlite block ending")
              indent = indent_of(lines[start])
              lines[start] = indent + "let rows = statement"
              lines[end] = lines[end] + ";"
              lines.insert(end + 1, indent + "rows")

          list_start = find_start(
              lambda next_line: "query_map([], |row| row.get::<_, i64>(0))" in next_line
          )
          finish_collected_block(list_start)

          location_start = find_start(
              lambda next_line: "query_map([download_id], |row|" in next_line
          )
          location_end = None
          for index in range(location_start + 1, min(location_start + 30, len(lines))):
              if lines[index].strip() == ".collect()":
                  location_end = index
                  break
          if location_end is None:
              raise SystemExit("Could not locate load_locations collect")
          location_indent = indent_of(lines[location_start])
          lines[location_start] = location_indent + "let rows = statement"
          lines[location_end] = lines[location_end] + ";"
          lines.insert(location_end + 1, location_indent + "rows")

          graph_start = find_start(
              lambda next_line: next_line == ".query_map([], |row| {"
          )
          finish_collected_block(graph_start)

          path.write_text("\n".join(lines) + "\n")

          trust = Path("src-tauri/src/trust.rs")
          trust_text = trust.read_text()
          old_import = "    fs::{self, File},\n"
          if trust_text.count(old_import) != 1:
              raise SystemExit("Expected one trust import replacement")
          trust.write_text(trust_text.replace(old_import, "    fs::File,\n", 1))
          PY

      - name: Format and commit
        shell: bash
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git rm .github/workflows/diagnose-sidecar.yml
          git add src-tauri/src/passport.rs src-tauri/src/trust.rs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix OriginKeep 2.0 Rust CI blockers"
          git push origin HEAD:origin-2-universal-file-passport
