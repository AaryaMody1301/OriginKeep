name: OriginKeep 2.0 lockfiles

on:
  push:
    branches: [originkeep-2.0-universal-passport]

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: originkeep-2.0-universal-passport
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - name: Regenerate exact dependency locks
        run: |
          npm install --package-lock-only --ignore-scripts
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit lockfile changes when needed
        run: |
          if git diff --quiet -- package-lock.json src-tauri/Cargo.lock; then
            echo "Lockfiles already match manifests."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          git commit -m "Refresh OriginKeep 2.0 dependency locks"
          git push origin HEAD:originkeep-2.0-universal-passport
