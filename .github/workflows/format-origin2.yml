name: Format OriginKeep 2.0

on:
  push:
    branches: [origin-2-universal-file-passport]

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: origin-2-universal-file-passport
      - name: Install rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Format Rust sources
        run: cargo +stable fmt --manifest-path src-tauri/Cargo.toml
      - name: Commit formatter output when needed
        shell: bash
        run: |
          if git diff --quiet -- src-tauri; then
            echo "No formatter changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git commit -m "Apply rustfmt to OriginKeep 2.0"
          git push origin HEAD:origin-2-universal-file-passport
