[package]
name = "originkeep"
version = "0.1.0"
description = "Local-first download provenance and freshness manager"
authors = ["Aarya Linesh Mody"]
edition = "2021"

[lib]
name = "originkeep_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "originkeep"
path = "src/main.rs"

[[bin]]
name = "originkeep-native-host"
path = "src/bin/originkeep-native-host.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
