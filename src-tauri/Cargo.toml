[package]
name = "originkeep"
version = "0.2.0"
description = "Local-first universal file provenance and File Passport manager"
authors = ["Aarya Linesh Mody"]
edition = "2021"

[lib]
name = "originkeep_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "originkeep"
path = "src/main.rs"

[[bin]]
name = "originkeep-native-host"
path = "src/bin/originkeep-native-host.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
csv = "1.3"
similar = "2.7"
pdf-extract = "0.10"
c2pa = { version = "0.90.16", default-features = false, features = ["file_io", "rust_native_crypto", "pdf"] }
sigstore-verify = "0.9.0"
sigstore-trust-root = "0.9.0"
sigstore-types = "0.9.0"
